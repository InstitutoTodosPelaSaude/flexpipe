files:
  keep:             "builds/flu-h1n1-ha-brazil/keep.txt"
  ignore:           "builds/flu-h1n1-ha-brazil/ignore.txt"
  cache:            "builds/flu-h1n1-ha-brazil/cache_coordinates.tsv"
  reference:        "builds/flu-h1n1-ha-brazil/reference.gb"
  clades:           "builds/flu-h1n1-ha-brazil/clades.tsv"
  auspice_config:   "builds/flu-h1n1-ha-brazil/auspice_config.json"
  subsample_config: "builds/flu-h1n1-ha-brazil/subsample.yaml"

parameters:
  # Terminal masking — values are REFERENCE-SPECIFIC for MW626062.1 (HA gene, 1752 bp).
  # Current values (0) disable terminal masking; calibrate before a production run.
  mask_5prime: 0
  mask_3prime: 0
  mask_sites: ""
  mask_sites_file: ""
  ufboot: 0
  model: "JC"
  root: "least-squares"
  coalescent: "skyline"
  date_inference: "marginal"
  date_confidence: false
  divergence_units: "mutations"
  clock_filter_iqd: 4
  ancestral_inference: "joint"
  traits_confidence: false

options:
  threads: 4

coordinates:
  columns: "country division location"

colours:
  geo:      "continent country region division location"
  source:   "source"
  data_use: "data_use"
  clade:    "clade_truncated clade"

traits:
  columns: "continent country region division"
  max_states: 50
  rare_state_label: "other"

subsampling:
  random_seed: 42

curation:
  clade_levels: 2
  clade_separator: "."
  lineage_parser: "none"

qc:
  genome_quality: ["A", "B"]
  min_coverage: 0.7
  min_sequences: 10
  required_columns: []

# ── Region source ────────────────────────────────────────────────────────────
# "division" : maps Brazilian state → macro-region (Brazil-focal builds)
region_source: "division"

# ── Data source ──────────────────────────────────────────────────────────────
data_source: "ncbi"

pathoplexus:
  organism: ""
  metadata_fields: []
  query_params: {}
  strip_fasta_id_suffix: false
  genome_size: 0

ncbi:
  taxid: 114727   # Influenza A virus H1N1 subtype
  genome_size: 1752  # MW626062.1 (A/Wisconsin/588/2019(H1N1)) HA gene, 1752 bp
  # min_length/max_length default to 0.7/1.1 × genome_size (1226–1927 bp)
  email: ""        # set via NCBI_EMAIL env var
  api_key: ""      # set via NCBI_API_KEY env var (optional)

viralqc:
  expected_virus: ""   # Flu strain names in BLAST db are strain-specific; leave unset
  expected_segment: ""  # ViralQC uses "HA" not "4"; Nextclade QC filters non-HA by alignment quality
  datasets_dir: ""
