files:
  keep:             "builds/yfv-brazil/keep.txt"
  ignore:           "builds/yfv-brazil/ignore.txt"
  cache:            "builds/yfv-brazil/cache_coordinates.tsv"
  reference:        "builds/yfv-brazil/reference.gb"
  clades:           "builds/yfv-brazil/clades.tsv"
  auspice_config:   "builds/yfv-brazil/auspice_config.json"
  subsample_config: "builds/yfv-brazil/subsample.yaml"

parameters:
  mask_5prime: 142      # X03700.1-specific: update per-reference for other builds
  mask_3prime: 548      # X03700.1-specific: update per-reference for other builds
  mask_sites: "1"
  mask_sites_file: ""   # optional BED file of problematic sites (leave blank for none)
  ufboot: 1000
  model: "MFP"
  root: "least-squares"
  coalescent: "skyline"
  date_inference: "marginal"
  divergence_units: "mutations"
  clock_filter_iqd: 4
  ancestral_inference: "joint"

options:
  threads: 4

coordinates:
  columns: "country division location"

colours:
  host:     "source"
  clade:    "clade_truncated clade"
  geo:      "continent country division location"
  source:   "source"
  data_use: "data_use"

traits:
  columns: "continent country division location clade"
  max_states: 200
  rare_state_label: "other"

subsampling:
  random_seed: 42

curation:
  clade_levels: 1      # YFV genotypes are single-level (I, II, III, ...)
  clade_separator: "."
  lineage_parser: "none"

# ── Region source ────────────────────────────────────────────────────────────
# "country"  : maps country → continent (global builds)
# "division" : maps Brazilian state → macro-region (Brazil-only builds)
region_source: "division"

# ── Data source ──────────────────────────────────────────────────────────────
# Use "pathoplexus" OR "ncbi" — never both at the same time.
data_source: "pathoplexus"

pathoplexus:
  organism: "yellow-fever"
  base_url: "https://lapis.pathoplexus.org"
  metadata_endpoint: "details"
  sequences_endpoint: "unalignedNucleotideSequences"
  min_completeness: 0.70
  # auth_token: ""       # leave blank for open-access data

ncbi:
  taxid: 11089             # Yellow fever virus; RSV-A: 12234, RSV-B: 12233, Flu A: 11320
  genome_size: 10862       # bp (reference X03700.1 — 17D vaccine strain)
  min_length: 0.7          # minimum as a fraction of genome_size
  max_length: 1.1          # maximum as a fraction of genome_size
  email: ""                # NCBI Entrez email (recommended; avoids rate-limiting)
  api_key: ""              # optional; raises rate limit to 10 req/s

viralqc:
  conda_env: "viralQC"
  clade_column: "clade"
  datasets_dir: ""          # set VIRALQC_DATASETS_DIR env var or override here
  blast_database: ""        # derived from datasets_dir by default
  blast_database_metadata: "" # derived from datasets_dir by default

qc:
  genome_quality:
    - "A"
    - "B"
  min_coverage: 0.70
  required_columns:
    - "strain"
    - "date"
    - "clade"

local_sequences:
  enabled: false         # set to true to merge local surveillance sequences
  metadata: "data/metadata.xlsx"
  sequences: "data/new_sequences.fasta"
