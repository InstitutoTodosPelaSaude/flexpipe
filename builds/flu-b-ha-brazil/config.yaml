files:
  keep:             "builds/flu-b-ha-brazil/keep.txt"
  ignore:           "builds/flu-b-ha-brazil/ignore.txt"
  cache:            "builds/flu-b-ha-brazil/cache_coordinates.tsv"
  reference:        "builds/flu-b-ha-brazil/reference.gb"
  clades:           "builds/flu-b-ha-brazil/clades.tsv"
  auspice_config:   "builds/flu-b-ha-brazil/auspice_config.json"
  subsample_config: "builds/flu-b-ha-brazil/subsample.yaml"

parameters:
  # Terminal masking — values are REFERENCE-SPECIFIC for KX058884.1 (HA gene, 1885 bp).
  # Current values (0) disable terminal masking; calibrate before a production run.
  mask_5prime: 0
  mask_3prime: 0
  mask_sites: ""
  mask_sites_file: ""
  ufboot: 0
  model: "JC"
  root: "least-squares"
  coalescent: "skyline"
  date_inference: "marginal"
  date_confidence: false
  divergence_units: "mutations"
  clock_filter_iqd: 4
  ancestral_inference: "joint"
  traits_confidence: false

options:
  threads: 4

coordinates:
  columns: "country division location"

colours:
  geo:      "continent country region division location"
  source:   "source"
  data_use: "data_use"
  clade:    "clade_truncated clade"

traits:
  columns: "continent country region division"
  max_states: 50
  rare_state_label: "other"

subsampling:
  random_seed: 42

curation:
  clade_levels: 2
  clade_separator: "."
  lineage_parser: "none"

qc:
  genome_quality: ["A", "B"]
  min_coverage: 0.7
  min_sequences: 10
  required_columns: []

# ── Region source ────────────────────────────────────────────────────────────
# "division" : maps Brazilian state → macro-region (Brazil-focal builds)
region_source: "division"

# ── Data source ──────────────────────────────────────────────────────────────
data_source: "ncbi"

pathoplexus:
  organism: ""
  metadata_fields: []
  query_params: {}
  strip_fasta_id_suffix: false
  genome_size: 0

ncbi:
  taxid: 11520   # Influenza B virus
  genome_size: 1885  # KX058884.1 (B/Brisbane/60/2008 Victoria) HA gene, 1885 bp
  # min_length/max_length default to 0.7/1.1 × genome_size (1319–2073 bp)

viralqc:
  expected_virus: ""   # Flu B BLAST strain name is "Influenza B virus (B/Lee/1940)";
                       # all flu B sequences should match, but leave unset to avoid fragility
  expected_segment: "4"  # HA = segment 4 in NCBI RefSeq flu
  datasets_dir: ""
