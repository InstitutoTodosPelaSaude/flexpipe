# Subsampling for DENV-1 Genotype V Brazil build
#
# Brazil-focal with global context:
# - up to 2 sequences per Brazilian state-month
# - up to 1 sequence per non-Brazil country-month
#
# clade_filter upstream already restricts the input to genotype V only,
# so no genotype clause is needed in these queries.

defaults:
  min_date: 2010
  exclude: builds/denv1-V-brazil/ignore.txt
  exclude_ambiguous_dates_by: month

samples:
  brazil:
    query: "country == 'Brazil'"
    include: builds/denv1-V-brazil/keep.txt
    group_by:
      - division
      - year
      - month
    sequences_per_group: 2

  context:
    query: "country != 'Brazil'"
    group_by:
      - country
      - year
      - month
    sequences_per_group: 1
