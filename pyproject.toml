[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flexpipe"
dynamic = ["version"]
description = "Flexible Nextstrain pipeline for genomic epidemiology of viral pathogens"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Anderson Brito", email = "andersonbrito@itps.org.br"},
    {name = "Thales Bermann", email = "thalesbermann@gmail.com"},
]
keywords = ["nextstrain", "genomic-epidemiology", "phylogenetics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas",
    "pyyaml",
    "biopython",
    "geopy",
    "requests",
    "matplotlib>=3.9",
    "colour",
    "openpyxl",
    "beautifulsoup4",
    "pydantic>=2",
    "filelock",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "responses",
]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "responses",
]

[project.scripts]
flexpipe-fetch-pathoplexus = "flexpipe.cli:fetch_pathoplexus"
flexpipe-fetch-ncbi        = "flexpipe.cli:fetch_ncbi"
flexpipe-merge             = "flexpipe.cli:merge"
flexpipe-curate            = "flexpipe.cli:curate"
flexpipe-coordinates       = "flexpipe.cli:coordinates"
flexpipe-disambiguate-geo  = "flexpipe.cli:disambiguate_geo"
flexpipe-update-cache      = "flexpipe.cli:update_cache"
flexpipe-name2hue          = "flexpipe.cli:name2hue"
flexpipe-colours           = "flexpipe.cli:colours"
flexpipe-collapse-traits   = "flexpipe.cli:collapse_traits"
flexpipe-normalize-dates   = "flexpipe.cli:normalize_dates"
flexpipe-reference-mask    = "flexpipe.cli:reference_mask"
flexpipe-qc-summary        = "flexpipe.cli:qc_summary"
flexpipe-run               = "flexpipe.cli:run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["flexpipe"]

[tool.hatch.build.targets.wheel.force-include]
"flexpipe/data" = "flexpipe/data"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "viralQC",   # git submodule — linted by upstream
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by black
    "B008",   # function call in default argument
]

[tool.black]
line-length = 100
target-version = ["py39"]
exclude = '''
/(
    viralQC
)/
'''

[tool.pytest.ini_options]
markers = [
    "integration: invokes external tools (augur/iqtree/mafft); slow",
    "network: hits real external services (Pathoplexus, NCBI, Nominatim); skipped by default",
]
addopts = "-m 'not integration and not network'"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
